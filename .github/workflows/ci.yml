name: CI
on:
  push: {branches: [main]}
  pull_request: {}
permissions: {contents: read, security-events: write}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x", cache: true}
      - run: test -z "$(gofmt -l cmd internal sdk/go gen tests/integration)"
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./cmd/... ./internal/... ./sdk/go/...
      - run: scripts/check-go-coverage.sh coverage.out 10
      - run: go test -coverprofile=workflow-coverage.out ./internal/workflow && scripts/check-go-coverage.sh workflow-coverage.out 70
      - run: go test -coverprofile=auth-coverage.out ./internal/auth && scripts/check-go-coverage.sh auth-coverage.out 40
      - run: go test -coverprofile=live-coverage.out ./internal/live && scripts/check-go-coverage.sh live-coverage.out 70
      - uses: actions/upload-artifact@v7
        with: {name: go-coverage, path: "*-coverage.out"}
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -e 'sdk/python[dev]'
      - run: ruff check sdk/python examples
      - run: cd sdk/python && mypy runmesh && pytest --junitxml=../../pytest.xml
      - uses: actions/upload-artifact@v7
        with: {name: python-coverage, path: sdk/python/coverage.xml}
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7
        with: {name: web-coverage, path: web/coverage/coverage-summary.json}
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: bufbuild/buf-setup-action@v1
        with: {github_token: "${{ github.token }}"}
      - run: buf lint
      - run: buf breaking --against '.git#branch=origin/main' || test "${{ github.event_name }}" = push
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.10.5}
      - uses: azure/setup-helm@v4
        with: {version: v3.17.3}
      - name: Install manifest validators
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin actionlint
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
      - run: actionlint
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - run: helm lint deploy/helm/runmesh --set secret.databaseURL=postgres://db --set secret.redisURL=redis://redis --set secret.internalToken=test --set secret.apiKeyPepper=test
      - run: helm template runmesh deploy/helm/runmesh --set secret.databaseURL=postgres://db --set secret.redisURL=redis://redis --set secret.internalToken=test --set secret.apiKeyPepper=test | kubeconform -strict -summary -kubernetes-version 1.31.0
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x", cache: true}
      - run: go test -tags=integration -count=1 -timeout=15m ./tests/integration
  containers:
    runs-on: ubuntu-latest
    needs: [go, python, web, protobuf, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: control-plane, dockerfile: Dockerfile, build-args: "SERVICE=control-plane"}
          - {service: scheduler, dockerfile: Dockerfile, build-args: "SERVICE=scheduler"}
          - {service: worker-go, dockerfile: Dockerfile, build-args: "SERVICE=worker-go"}
          - {service: worker-python, dockerfile: sdk/python/Dockerfile, build-args: ""}
          - {service: web, dockerfile: web/Dockerfile, build-args: "WEB_DEVELOPMENT_MODE=false"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          tags: runmesh/${{ matrix.service }}:${{ github.sha }}
          load: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: "runmesh/${{ matrix.service }}:${{ github.sha }}", severity: CRITICAL, exit-code: "1", ignore-unfixed: true}
  kind-upgrade:
    runs-on: ubuntu-latest
    needs: [deployment]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.17.3}
      - name: Install kind
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - run: tests/deployment/kind-rolling-upgrade.sh
  compose-e2e:
    runs-on: ubuntu-latest
    needs: [containers]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build postgres redpanda migrate control-plane scheduler worker-python web
      - run: bash tests/e2e/smoke.sh
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: cd web && npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down -v
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-e2e-results
          path: |
            compose.log
            web/playwright-results.xml
            web/test-results/
