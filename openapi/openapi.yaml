openapi: 3.1.0
info:
  title: RunMesh API
  version: 0.1.0
  description: Multi-tenant workflow orchestration API. Task execution is at-least-once.
x-rate-limit:
  policy: token-bucket
  defaultRatePerSecond: 100
  defaultBurst: 200
  responses:
    "429": Tenant bucket exhausted; inspect Retry-After and RateLimit-* headers
    "503": Redis unavailable while production fail-closed enforcement is active
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:

  /v1/stream:
    get:
      operationId: streamTenantEvents
      description: Upgrade to a tenant-scoped WebSocket. Browser clients pass the OIDC token using the `bearer.<token>` WebSocket subprotocol and must re-read durable API state after every notification.
      responses:
        "101": {description: WebSocket upgrade; notifications are best-effort}
        "401": {description: Missing or invalid credential}
        "503": {description: Redis live notification service unavailable}

  /v1/api-keys:
    get:
      operationId: listAPIKeys
      responses: {"200": {description: Tenant API keys without secret material}}
    post:
      operationId: createAPIKey
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/APIKeyInput'}}}}
      responses: {"201": {description: API key and one-time plaintext token}}
  /v1/api-keys/{id}/rotate:
    post:
      operationId: rotateAPIKey
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"200": {description: Rotated API key and one-time plaintext token}}
  /v1/api-keys/{id}:
    delete:
      operationId: revokeAPIKey
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"204": {description: Revoked}}
  /v1/artifacts/uploads:
    post:
      operationId: createArtifactUpload
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtifactUploadInput'}}}}
      responses: {"201": {description: Pending artifact and 15-minute presigned PUT URL}, "422": {description: Invalid kind, checksum, or size}}
  /v1/artifacts/{id}/complete:
    post:
      operationId: completeArtifactUpload
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"200": {description: Ready artifact metadata}, "409": {description: Object is missing or has the wrong size}}
  /v1/artifacts/{id}/download:
    get:
      operationId: getArtifactDownload
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"200": {description: Authorized 15-minute presigned GET URL}, "404": {description: Artifact is not owned by this tenant}}
  /v1/workflows:
    get:
      operationId: listWorkflows
      responses: {"200": {description: Latest workflow definitions}}
    post:
      operationId: createWorkflow
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowInput'}}}}
      responses: {"201": {description: Created}, "422": {description: Invalid DAG}}
  /v1/workflows/{id}:
    get:
      operationId: getWorkflow
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"200": {description: Workflow definition}, "404": {description: Not found}}
  /v1/workflows/{id}/versions:
    post:
      operationId: createWorkflowVersion
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowInput'}}}}
      responses: {"201": {description: Version created}}
  /v1/workflows/{id}/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 200}
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {input: {type: object}, input_artifact_id: {type: string, format: uuid, description: Ready tenant-owned input artifact}}}}}}
      responses: {"201": {description: Created}, "200": {description: Existing idempotent result}}
  /v1/runs/{id}:
    get:
      operationId: getRun
      description: Returns tenant-scoped run state, task dependencies, active lease metadata, and immutable attempt history including workers and failure messages.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"200": {description: Run with tasks}, "404": {description: Not found}}
  /v1/runs:
    get:
      operationId: listRuns
      responses: {"200": {description: Recent tenant-scoped runs}}
  /v1/runs/{id}/cancel:
    post:
      operationId: cancelRun
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"204": {description: Cancelled}, "409": {description: Terminal run}}
  /v1/runs/{id}/retry:
    post:
      operationId: retryRun
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"202": {description: Dead tasks replayed}}
  /v1/runs/{id}/events:
    get:
      operationId: getRunEvents
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"200": {description: Ordered event stream}}
  /v1/workers:
    get: {operationId: listWorkers, responses: {"200": {description: Workers}}}
  /v1/dead-letter:
    get: {operationId: listDeadLetter, responses: {"200": {description: Dead tasks}}}
  /v1/dead-letter/{id}/replay:
    post:
      operationId: replayDeadTask
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"202": {description: Replayed}}
  /v1/schedules:
    post:
      operationId: createSchedule
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleInput'}}}}
      responses: {"201": {description: Schedule created}, "422": {description: Invalid cron or timezone}}
  /v1/schedules/{id}:
    patch:
      operationId: patchSchedule
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}, next_execution_at: {type: string, format: date-time}}}}}}
      responses: {"204": {description: Updated}}
    delete:
      operationId: deleteSchedule
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {"204": {description: Deleted}}
  /health/live:
    get: {security: [], operationId: liveness, responses: {"200": {description: Process is live}}}
  /health/ready:
    get: {security: [], operationId: readiness, responses: {"200": {description: Dependencies are ready}, "503": {description: Dependency unavailable}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OIDC access token
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Tenant API key formatted as: Bearer rm_<id>_<secret>"
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    APIKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string, maxLength: 100}
        scopes: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        expires_at: {type: string, format: date-time}
    ArtifactUploadInput:
      type: object
      required: [kind, content_type, size_bytes]
      properties:
        kind: {type: string, enum: [input, output, log]}
        content_type: {type: string}
        size_bytes: {type: integer, minimum: 0, maximum: 104857600}
        checksum_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        task_run_id: {type: string, format: uuid}
    WorkflowInput:
      type: object
      required: [name, tasks]
      properties:
        name: {type: string}
        tasks:
          type: object
          additionalProperties:
            type: object
            required: [handler]
            properties:
              handler: {type: string}
              depends_on: {type: array, items: {type: string}}
              maximum_attempts: {type: integer, minimum: 1, maximum: 100}
              timeout_seconds: {type: integer, minimum: 1, maximum: 86400}
              priority: {type: integer}
    ScheduleInput:
      type: object
      required: [workflow_definition_id, cron_expression]
      properties:
        workflow_definition_id: {type: string, format: uuid}
        cron_expression: {type: string, example: "0 * * * *"}
        timezone: {type: string, default: UTC}
        next_execution_at: {type: string, format: date-time}
        misfire_policy: {type: string, enum: [skip, catch_up_once], default: skip}
