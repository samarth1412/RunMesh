image:
  repository: ghcr.io/example/runmesh
  tag: latest
  pullPolicy: IfNotPresent
webImage:
  repository: ghcr.io/example/runmesh-web
  tag: latest
replicas: {controlPlane: 2, scheduler: 2, web: 2}
config:
  databaseURL: ""
  kafkaBrokers: "redpanda:9092"
  kafkaTopic: runmesh.tasks
  oidcIssuer: ""
  corsAllowlist: ""
secret:
  internalToken: ""
resources:
  controlPlane: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1, memory: 512Mi}}
  scheduler: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 1, memory: 512Mi}}
ingress: {enabled: false, className: nginx, host: runmesh.example.com, tlsSecret: ""}
