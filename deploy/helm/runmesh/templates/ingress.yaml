{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: runmesh}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: runmesh-web, port: {name: http}}}}]}
{{- end }}
