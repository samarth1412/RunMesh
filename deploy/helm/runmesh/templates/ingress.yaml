{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runmesh
  labels:
    {{- include "runmesh.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tlsSecret }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: {service: {name: runmesh-control-plane, port: {name: http}}}
          - path: /health
            pathType: Prefix
            backend: {service: {name: runmesh-control-plane, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: runmesh-web, port: {name: http}}}
{{- end }}
