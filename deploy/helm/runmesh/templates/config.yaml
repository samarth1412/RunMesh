apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runmesh.name" . }}
  labels:
    {{- include "runmesh.labels" . | nindent 4 }}
data:
  RUNMESH_HTTP_ADDR: ":8080"
  RUNMESH_KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  RUNMESH_KAFKA_TOPIC: {{ .Values.config.kafkaTopic | quote }}
  RUNMESH_DEV_AUTH: "false"
---
apiVersion: v1
kind: Secret
metadata: {name: {{ include "runmesh.name" . }}}
type: Opaque
stringData:
  RUNMESH_DATABASE_URL: {{ required "config.databaseURL is required" .Values.config.databaseURL | quote }}
  RUNMESH_INTERNAL_TOKEN: {{ required "secret.internalToken is required" .Values.secret.internalToken | quote }}
