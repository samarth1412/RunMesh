apiVersion: v1
kind: Service
metadata:
  name: runmesh-control-plane
  labels:
    {{- include "runmesh.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: runmesh, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: control-plane}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 7001, targetPort: grpc}
---
apiVersion: v1
kind: Service
metadata:
  name: runmesh-scheduler
  labels:
    {{- include "runmesh.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: runmesh, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: scheduler}
  ports: [{name: metrics, port: 9091, targetPort: metrics}]
---
apiVersion: v1
kind: Service
metadata:
  name: runmesh-web
  labels:
    {{- include "runmesh.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: runmesh, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  ports: [{name: http, port: 80, targetPort: http}]
