apiVersion: v1
kind: Service
metadata: {name: runmesh-control-plane}
spec:
  selector: {app.kubernetes.io/name: runmesh, app.kubernetes.io/component: control-plane}
  ports: [{name: http, port: 8080, targetPort: http}, {name: grpc, port: 7001, targetPort: grpc}]
---
apiVersion: v1
kind: Service
metadata: {name: runmesh-web}
spec:
  selector: {app.kubernetes.io/name: runmesh, app.kubernetes.io/component: web}
  ports: [{name: http, port: 80, targetPort: http}]
