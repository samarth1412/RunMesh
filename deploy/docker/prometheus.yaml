global: {scrape_interval: 5s}
rule_files: [/etc/prometheus/rules.yaml]
scrape_configs:
  - job_name: control-plane
    static_configs: [{targets: ["control-plane:8080"]}]
  - job_name: scheduler
    static_configs: [{targets: ["scheduler:9091"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8889"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"]}]
